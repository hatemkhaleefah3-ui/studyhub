    <title>Page not found — Study Hub</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      p { line-height: 1.65; opacity: .75; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.1rem; border: 1px solid currentColor; border-radius: .9rem; color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
